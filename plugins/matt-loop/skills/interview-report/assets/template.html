<!--
  Starting point for interview-report's decision graph. Copy this file, then
  replace ONLY:
    1. the <title> tag
    2. the JSON inside <script id="graph-data" type="application/json">
  Keep the CSS and JS as-is — the rendering, editing, flagging, and export
  machinery lives there, and consistent output between runs is the point of
  bundling this template.

  Data contract (see SKILL.md for the full spec):
    { title, slug, generated, summary,
      stages: [ { id, name, skill, status, note,
                  decisions: [ { id, question, before, change, decision,
                                rationale, escalated } ] } ],
      progress?: { state, updated, startedAt, current, note },
      plan?: { concurrency, placement, note,
               waves: [ { id, mode, why, tickets: [ticketId] } ] },
      tickets?: [ { id, title, status, blockedBy, blocker: { reason, detail },
                    gates: { met, total }, route, estimateMin, actualMin,
                    startedAt, note,
                    worker: { model, effort, dispatchId, worktree },
                    acceptance: [text], steps: [ { name, status, note } ],
                    gateList: [ { id, text, status, check, expect, actual } ],
                    files: [ { path, added, removed } ],
                    commits: [ { sha, subject } ] } ],
      review?: { status, skill, note,
                 passes: [ { id, name, status, findings, note } ] },
      pr?: { number, url, base, branch, status, cycles, note,
             checks: [ { name, status, detail } ] },
      outcome?: { baseRef, headRef, branch, note,
                  files: [ { path, status, kind, added, removed, note } ] } }
  `outcome` is the final run's shipped-changes panel: omit it entirely on the
  interview-gate generation, fill it on the last regeneration.
  Decision ids must be stable across regenerations — localStorage edits and
  the exported <slug>.edits.json both key on them.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPLACE: idea/feature name — Decision Graph</title>
<style>
  /* Design tokens follow robodata's frontend (frontend/src/App.css): layered
     panels rather than one flat field, Catppuccin-family semantic colors at 10%
     dim backgrounds, and #ff9830 as the accent. Both ends are pulled off the
     extremes on purpose — a report is read for minutes at a time and either
     extreme tires the eye — and the dark surfaces sit on Claude's warm base
     (#262624 ground, #30302e panels), which stays neutral-warm rather than
     drifting blue the way a cool near-black does. */
  :root {
    color-scheme: dark;
    --background: #262624;
    --bg-deep: #1f1e1d;
    --card: #30302e;
    --secondary: #3a3a38;
    --foreground: #e3e3e0;
    --muted-foreground: #a0a09a;
    --dim: #72726c;
    --accent: #414140;
    --border: #3a3a37;
    --border-strong: #4a4a46;
    --ring: #5c5c56;
    --radius: 6px;
    --radius-md: 5px;
    --radius-sm: 4px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "Fira Code", SFMono-Regular, ui-monospace, Menlo, monospace;

    --brand: #ff9830;
    --brand-bg: rgb(255 152 48 / 0.08);
    --done: #a6e3a1;
    --done-bg: rgb(166 227 161 / 0.10);
    --progress: #89b4fa;
    --progress-bg: rgb(137 180 250 / 0.10);
    --escalated: #f9e2af;
    --escalated-bg: rgb(249 226 175 / 0.10);
    --edited: #ff9830;
    --edited-bg: rgb(255 152 48 / 0.10);
    --flagged: #f38ba8;
    --flagged-bg: rgb(243 139 168 / 0.10);
    --muted-bg: rgb(255 255 255 / 0.04);
    --on-primary: #1f1e1d;
    --primary-hover: #ffab55;
  }
  /* Light is the same system read on paper — a warm yellow-grey stack rather
     than a white one, so it sits in the same family as the warm dark base, with
     the pastels darkened to hold contrast on it. */
  :root[data-theme="light"] {
    color-scheme: light;
    --background: #f6f4ee;
    --bg-deep: #ece9e0;
    --card: #fcfbf7;
    --secondary: #f0ede4;
    --foreground: #37362f;
    --muted-foreground: #74726a;
    --dim: #a09e94;
    --accent: #e9e5da;
    --border: #e3dfd4;
    --border-strong: #cfcabb;
    --ring: #b3ae9f;

    --brand: #c2610b;
    --brand-bg: rgb(194 97 11 / 0.09);
    --done: #40a02b;
    --done-bg: rgb(64 160 43 / 0.10);
    --progress: #1e66f5;
    --progress-bg: rgb(30 102 245 / 0.09);
    --escalated: #b07d10;
    --escalated-bg: rgb(176 125 16 / 0.11);
    --edited: #c2610b;
    --edited-bg: rgb(194 97 11 / 0.10);
    --flagged: #c81e3a;
    --flagged-bg: rgb(200 30 58 / 0.09);
    --muted-bg: rgb(0 0 0 / 0.04);
    --on-primary: #ffffff;
    --primary-hover: #a75209;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px clamp(16px, 3vw, 56px) 72px;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--background); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ring); }
  /* The page fills the screen the reader gave it; only running text is held to
     a readable measure, so the flow can use every pixel it wants. */
  main { max-width: min(1680px, 100%); margin: 0 auto; }
  .measure { max-width: 78ch; }
  .head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
  .head .titles { min-width: 0; flex: 1 1 auto; }
  h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.25; margin: 0 0 6px; }
  #btn-theme {
    flex: none;
    font: inherit;
    font-size: 12px;
    height: 30px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  #btn-theme:hover { background: var(--accent); border-color: var(--border-strong); color: var(--foreground); }
  code { font-family: var(--font-mono); font-size: 0.92em; }
  :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }

  .meta { color: var(--muted-foreground); font-size: 12px; margin: 0; }
  .summary {
    max-width: 78ch;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .summary .icon { margin-right: 8px; }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 32px; }
  .toolbar button {
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    height: 30px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .toolbar button:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--border-strong);
    color: var(--foreground);
  }
  .toolbar button.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--on-primary);
    font-weight: 600;
  }
  .toolbar button.primary:hover:not(:disabled) {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
    color: var(--on-primary);
  }
  .toolbar button:disabled { opacity: 0.45; cursor: default; }
  .toolbar .count { color: var(--muted-foreground); font-size: 12px; }
  .toolbar .hint { flex-basis: 100%; max-width: 78ch; color: var(--muted-foreground); font-size: 12px; line-height: 1.6; }

  /* ── pipeline rail ─────────────────────────────────────────── */
  .stage { display: flex; gap: 18px; }
  .rail { display: flex; flex-direction: column; align-items: center; flex: 0 0 24px; }
  .rail .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    background: var(--background);
    flex: 0 0 auto;
    margin-top: 8px;
  }
  .stage.done .dot { border-color: var(--done); background: var(--done); }
  .stage.in-progress .dot { border-color: var(--progress); }
  .stage.skipped .dot { border-color: var(--border-strong); background: var(--secondary); }
  .rail .line { width: 1px; flex: 1 1 auto; background: var(--border-strong); min-height: 24px; }
  .stage:last-child .rail .line { display: none; }
  .stage-body { flex: 1 1 auto; padding-bottom: 26px; min-width: 0; }
  .stage-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .stage-head h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .stage-head .skill { color: var(--muted-foreground); font-size: 12px; font-family: var(--font-mono); }
  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 1px 8px;
    border-radius: 3px;
    white-space: nowrap;
    background: var(--muted-bg);
    color: var(--muted-foreground);
  }
  .badge.done { background: var(--done-bg); color: var(--done); }
  .badge.in-progress { background: var(--progress-bg); color: var(--progress); }
  .badge.pending, .badge.skipped { background: var(--muted-bg); color: var(--muted-foreground); }
  .badge.escalated { background: var(--escalated-bg); color: var(--escalated); }
  .badge.edited { background: var(--edited-bg); color: var(--edited); }
  .badge.flagged { background: var(--flagged-bg); color: var(--flagged); }
  .stage-note { color: var(--muted-foreground); font-size: 12px; margin: 2px 0 0; }

  /* ── decision nodes ────────────────────────────────────────── */
  .decisions { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .node {
    border: 1px solid var(--border);
    border-left: 2px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--card);
  }
  .node.escalated { border-left-color: var(--escalated); }
  .node.edited { border-left-color: var(--edited); }
  .node.flagged { border-left-color: var(--flagged); }
  .node-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; cursor: pointer; }
  .node-head .q { font-weight: 500; flex: 1 1 auto; min-width: 0; }
  .node-head .caret { color: var(--muted-foreground); transition: transform 0.15s; }
  .node.open .node-head .caret { transform: rotate(90deg); }
  .node-detail { display: none; padding: 0 14px 12px; }
  .node.open .node-detail { display: block; }
  .node-detail .d { margin: 0 0 4px; }
  .node-detail .d.struck { text-decoration: line-through; color: var(--muted-foreground); }
  .node-detail .r { color: var(--muted-foreground); font-size: 13px; margin: 0 0 10px; }
  .node-detail label { display: block; font-size: 11px; color: var(--muted-foreground); margin: 8px 0 2px; }
  .node-detail textarea, .node-detail input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    background: var(--background);
    color: var(--foreground);
  }
  .node-detail textarea { resize: vertical; min-height: 48px; }
  .ba {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 8px;
    margin: 0 0 10px;
  }
  .ba .cell {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--background);
    padding: 8px 10px;
    min-width: 0;
  }
  .ba .cell .lbl { display: block; font-size: 11px; color: var(--muted-foreground); margin-bottom: 2px; }
  .ba .cell.before .txt { color: var(--muted-foreground); }
  .ba .cell.before.none .txt { font-style: italic; }
  .ba .cell.after { border-color: var(--border-strong); }
  .ba .arrow { align-self: center; color: var(--muted-foreground); font-size: 13px; }
  .badge.new { background: var(--progress-bg); color: var(--progress); }
  .badge.redirect { background: var(--edited-bg); color: var(--edited); }
  .badge.keep { background: var(--muted-bg); color: var(--muted-foreground); }
  @media (max-width: 560px) {
    .ba { grid-template-columns: 1fr; }
    .ba .arrow { transform: rotate(90deg); justify-self: start; }
  }
  .flag-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; }
  .flag-row input { accent-color: var(--flagged); }

  /* ── live progress + tickets ───────────────────────────────── */
  .progress {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 14px 18px;
    margin: 14px 0 0;
  }
  .progress .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .progress h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .progress .stamp { color: var(--muted-foreground); font-size: 11px; margin-left: auto; }
  .progress .current { max-width: 78ch; margin: 8px 0 0; font-size: 13px; }
  .progress .current .lbl { color: var(--muted-foreground); margin-right: 6px; }
  .progress .note { max-width: 78ch; color: var(--muted-foreground); font-size: 12px; margin: 6px 0 0; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--progress); flex: none;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .progress.state-blocked .live-dot { background: var(--flagged); animation: none; }
  .progress.state-done .live-dot { background: var(--done); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .blocker {
    border: 1px solid color-mix(in srgb, var(--flagged) 40%, var(--border));
    background: var(--flagged-bg);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-top: 12px;
  }
  .blocker .why { font-weight: 600; color: var(--flagged); }
  .blocker .detail { color: var(--foreground); font-size: 13px; margin: 2px 0 0; }

  .tickets { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .ticket {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--background);
    padding: 8px 12px;
  }
  .ticket.in-progress { border-color: color-mix(in srgb, var(--progress) 45%, var(--border)); }
  .ticket.blocked { border-color: color-mix(in srgb, var(--flagged) 45%, var(--border)); }
  .ticket .tid { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); flex: none; }
  .ticket .ttitle { flex: 1 1 220px; min-width: 0; }
  .ticket.done .ttitle { color: var(--muted-foreground); }
  .ticket .tnote { flex-basis: 100%; color: var(--muted-foreground); font-size: 12px; }
  .ticket .blocked-by { color: var(--muted-foreground); font-size: 11px; font-family: var(--font-mono); }
  .badge.blocked { background: var(--flagged-bg); color: var(--flagged); }
  .badge.gates { background: var(--muted-bg); color: var(--muted-foreground); font-family: var(--font-mono); }

  /* progress bars + ETA */
  .bar { height: 6px; border-radius: 999px; background: var(--muted-bg); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--progress); border-radius: 999px; }
  .progress.state-blocked .bar > span { background: var(--flagged); }
  .progress.state-done .bar > span { background: var(--done); }
  .bar.done > span { background: var(--done); }
  .overall { margin-top: 12px; }
  .overall .line { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted-foreground); margin-bottom: 5px; }
  .overall .pct { font-size: 22px; font-weight: 700; line-height: 1; color: var(--foreground); font-variant-numeric: tabular-nums; }
  .overall .eta { margin-left: auto; font-variant-numeric: tabular-nums; }
  .stage-bar { display: flex; align-items: center; gap: 8px; max-width: 240px; margin-top: 7px; }
  .stage-bar .bar { height: 4px; flex: 1 1 auto; }
  .stage-bar .pct { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; flex: none; }

  /* execution plan graph */
  .plan { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
  .plan .phead { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted-foreground); margin-bottom: 8px; }
  .wave { position: relative; padding: 0 0 6px 0; }
  .wave .whead { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted-foreground); margin: 0 0 5px; }
  .wave .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    border: 1px solid var(--border);
    border-left: 2px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: transparent;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .chip .ctitle { color: var(--foreground); }
  .chip .cid { font-family: var(--font-mono); color: var(--muted-foreground); }
  .chip .est { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .chip.done { border-left-color: var(--done); }
  .chip.done .ctitle { color: var(--muted-foreground); }
  .chip.in-progress { border-left-color: var(--progress); }
  .chip.blocked { border-left-color: var(--flagged); }
  .wave-link { color: var(--muted-foreground); font-size: 13px; line-height: 1; margin: 2px 0 6px 8px; }
  .plan .why { font-size: 11px; color: var(--muted-foreground); margin: 4px 0 0; }

  .refresh-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); margin-top: 12px; }
  .refresh-row button.ghost {
    font: inherit;
    font-size: 12px;
    height: 26px;
    padding: 0 10px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    cursor: pointer;
  }
  .refresh-row button.ghost:hover { background: var(--accent); border-color: var(--border-strong); color: var(--foreground); }

  /* ── execution flow: waves left to right, tickets as nodes ──── */
  .flow-wrap { overflow-x: auto; padding-bottom: 4px; margin-top: 14px; }
  .flow { display: flex; align-items: flex-start; gap: 0; min-width: min-content; }
  .wcol { display: flex; flex-direction: column; gap: 8px; flex: 0 1 auto; min-width: 208px; max-width: 320px; }
  .wcol .whead {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted-foreground);
    padding-bottom: 2px;
  }
  .wcol .wdur { margin-left: auto; font-variant-numeric: tabular-nums; }
  .conn { flex: 0 0 34px; align-self: flex-start; margin-top: 38px; display: flex; align-items: center; justify-content: center; position: relative; height: 20px; }
  .conn::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    border-top: 1px dashed var(--border-strong);
  }
  .conn span { position: relative; color: var(--muted-foreground); font-size: 12px; background: var(--card); padding: 0 3px; }
  .tnode {
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--background);
    padding: 9px 11px;
  }
  .tnode.done { border-left-color: var(--done); }
  .tnode.in-progress { border-left-color: var(--progress); box-shadow: 0 0 0 1px color-mix(in srgb, var(--progress) 35%, transparent); }
  .tnode.blocked { border-left-color: var(--flagged); box-shadow: 0 0 0 1px color-mix(in srgb, var(--flagged) 35%, transparent); }
  .tnode .nhead { display: flex; align-items: baseline; gap: 6px; }
  .tnode .ndot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--border-strong); align-self: center;
  }
  .tnode.done .ndot { background: var(--done); }
  .tnode.in-progress .ndot { background: var(--progress); animation: pulse 1.8s ease-in-out infinite; }
  .tnode.blocked .ndot { background: var(--flagged); }
  .tnode .nid { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
  .tnode .ntitle { font-size: 13px; font-weight: 500; }
  .tnode .nmeta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tnode .nagent {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted-foreground);
    background: var(--muted-bg);
    border-radius: var(--radius-sm);
    padding: 1px 6px;
  }
  .tnode .nwhy { font-size: 11px; color: var(--flagged); margin: 6px 0 0; }
  .tnode .nnote { font-size: 11px; color: var(--muted-foreground); margin: 6px 0 0; }

  /* long runs: finished waves shrink to a stub so the live one stays on screen */
  .wcol.collapsed { min-width: 74px; max-width: 74px; }
  .wcol.collapsed .tnode, .wcol.collapsed .why { display: none; }
  .wcol .wtoggle {
    font: inherit; font-size: 11px;
    color: var(--muted-foreground);
    background: transparent; border: 1px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 6px 8px; cursor: pointer; text-align: left;
    white-space: pre-line; line-height: 1.35;
  }
  .wcol .wtoggle:hover { color: var(--foreground); border-color: var(--muted-foreground); }
  .flow-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .flow-head .spacer { margin-left: auto; }

  /* ── ticket detail modal ────────────────────────────────────── */
  .tnode { cursor: pointer; }
  .tnode:hover { border-color: var(--muted-foreground); }
  .modal-back {
    position: fixed; inset: 0;
    background: rgb(0 0 0 / 0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 40;
  }
  .modal {
    width: min(880px, 100%);
    background: var(--background);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 20px 22px 24px;
  }
  .modal .mhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .modal h2 { font-size: 1.1rem; margin: 0; }
  .modal .mid { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
  .modal .mclose { margin-left: auto; font: inherit; font-size: 12px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--muted-foreground); height: 28px; padding: 0 10px; cursor: pointer; }
  .modal .mclose:hover { background: var(--accent); color: var(--foreground); }
  .msec { margin-top: 18px; }
  .msec > h3 {
    font-size: 11px; font-weight: 600; color: var(--muted-foreground);
    margin: 0 0 8px; letter-spacing: 0.04em;
  }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--muted-foreground); font-size: 12px; }
  .kv dd { margin: 0; }
  .kv dd.mono { font-family: var(--font-mono); font-size: 12px; }
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
  .step .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); flex: none; align-self: center; }
  .step.done .sdot { background: var(--done); }
  .step.in-progress .sdot { background: var(--progress); }
  .step.blocked .sdot, .step.failed .sdot { background: var(--flagged); }
  .step .snote { color: var(--muted-foreground); font-size: 12px; }
  .glist { display: flex; flex-direction: column; gap: 8px; }
  .gate {
    border: 1px solid var(--border);
    border-left: 2px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 13px;
  }
  .gate.met { border-left-color: var(--done); }
  .gate.unmet { border-left-color: var(--flagged); }
  .gate.manual { border-left-color: var(--escalated); }
  .gate .gid { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-right: 6px; }
  .gate .gcmd { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 4px; word-break: break-all; }
  .gate .gcmp { font-size: 12px; margin-top: 4px; }
  .mfiles { font-size: 12px; }
  .mfiles div { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .mfiles div:last-child { border-bottom: 0; }
  .mfiles .p { font-family: var(--font-mono); word-break: break-all; flex: 1 1 auto; }

  /* ── review + PR lanes at the end of the flow ───────────────── */
  .lane { min-width: 230px; max-width: 340px; display: flex; flex-direction: column; gap: 8px; }
  .lane .lhead { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-foreground); padding-bottom: 2px; }
  .checkrow { display: flex; align-items: baseline; gap: 8px; font-size: 12px; padding: 3px 0; }
  .checkrow .cdot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); flex: none; align-self: center; }
  .checkrow.ok .cdot, .checkrow.done .cdot { background: var(--done); }
  .checkrow.failed .cdot { background: var(--flagged); }
  .checkrow.pending .cdot { background: var(--escalated); }
  .checkrow .cdetail { color: var(--muted-foreground); }
  .tnode .plink { font-size: 11px; color: var(--progress); word-break: break-all; }

  /* ── decision review, behind a disclosure ───────────────────── */
  .disclosure-wrap { margin-top: 18px; }
  .disclosure {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--foreground);
    cursor: pointer;
  }
  .disclosure:hover { border-color: var(--border-strong); }
  .disclosure .caret { color: var(--muted-foreground); transition: transform 0.15s; }
  .disclosure[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .disclosure .dcount { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted-foreground); }
  #decisions-body { padding-top: 4px; max-width: 1040px; }
  #decisions-body[hidden] { display: none; }

  /* ── outcome (final run only) ──────────────────────────────── */
  .outcome {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 16px 18px;
    margin: 14px 0 0;
  }
  .outcome h2 { font-size: 1rem; font-weight: 600; margin: 0 0 2px; }
  .outcome .refs {
    color: var(--muted-foreground);
    font-size: 11px;
    font-family: var(--font-mono);
    margin-bottom: 14px;
  }
  .outcome .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .outcome .stat {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--background);
    padding: 8px 14px;
    min-width: 130px;
  }
  .outcome .stat .k { color: var(--muted-foreground); font-size: 11px; display: block; margin-bottom: 3px; }
  .outcome .stat .v { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .outcome .stat .sub { color: var(--muted-foreground); font-size: 11px; display: block; }
  .outcome .note { max-width: 78ch; color: var(--muted-foreground); font-size: 13px; margin: 12px 0 0; }
  .add { color: var(--done); font-variant-numeric: tabular-nums; }
  .del { color: var(--flagged); font-variant-numeric: tabular-nums; }
  .files-wrap { overflow-x: auto; margin-top: 14px; }
  table.files { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.files th, table.files td {
    text-align: left;
    padding: 7px 10px 7px 0;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    white-space: nowrap;
  }
  table.files tr:last-child td { border-bottom: 0; }
  table.files th { color: var(--muted-foreground); font-size: 11px; font-weight: 500; }
  table.files td.num { text-align: right; padding-right: 14px; }
  table.files .path { font-family: var(--font-mono); font-size: 12px; white-space: normal; word-break: break-all; }
  table.files .fnote { color: var(--muted-foreground); font-size: 12px; font-family: var(--font-sans); white-space: normal; }
  .badge.code { background: var(--progress-bg); color: var(--progress); }
  .badge.docs { background: var(--done-bg); color: var(--done); }
  .badge.other { background: var(--muted-bg); color: var(--muted-foreground); }
  .badge.added { background: var(--done-bg); color: var(--done); }
  .badge.modified { background: var(--edited-bg); color: var(--edited); }
  .badge.deleted { background: var(--flagged-bg); color: var(--flagged); }
  .badge.renamed { background: var(--muted-bg); color: var(--muted-foreground); }

  @media (max-width: 640px) {
    body { padding: 24px 14px 56px; }
    h1 { font-size: 1.35rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  var data = JSON.parse(document.getElementById("graph-data").textContent);
  var storeKey = "matt-auto-edits:" + data.slug;

  function loadEdits() {
    try {
      return JSON.parse(localStorage.getItem(storeKey)) || {};
    } catch (e) { return {}; }
  }
  function saveEdits() {
    try { localStorage.setItem(storeKey, JSON.stringify(edits)); } catch (e) {}
  }
  var edits = loadEdits(); // { [decisionId]: { decision?, flagged?, comment? } }

  var decisionsById = {};
  data.stages.forEach(function (s) {
    (s.decisions || []).forEach(function (d) { decisionsById[d.id] = { d: d, stage: s }; });
  });

  function editOf(id) { return edits[id] || {}; }
  function isEdited(id) {
    var e = editOf(id);
    return typeof e.decision === "string" && e.decision.trim() !== "" &&
           e.decision.trim() !== decisionsById[id].d.decision.trim();
  }
  function isFlagged(id) { return !!editOf(id).flagged; }
  function isChanged(id) { return isEdited(id) || isFlagged(id); }

  function setEdit(id, patch) {
    var e = edits[id] || {};
    Object.keys(patch).forEach(function (k) { e[k] = patch[k]; });
    if ((typeof e.decision !== "string" || e.decision.trim() === "" ||
         e.decision.trim() === decisionsById[id].d.decision.trim()) &&
        !e.flagged && !(e.comment && e.comment.trim())) {
      delete edits[id];
    } else {
      edits[id] = e;
    }
    saveEdits();
  }

  // ── theme ──────────────────────────────────────────────────
  // The sandboxed frame has no localStorage, and the page reloads itself while a
  // run is live, so the choice has to survive a reload without storage. It rides
  // in `window.name`, which belongs to the browsing context rather than the
  // origin and therefore persists; the hash is only honoured for direct links,
  // since assigning to it inside Orca's frame reloads the document and the
  // fragment is dropped. `replaceState` throws in an opaque origin — hence the
  // try/catch around the cosmetic URL update.
  var THEMES = { dark: { next: "light", label: "☀︎ 라이트" }, light: { next: "dark", label: "☾ 다크" } };
  var PREFIX = "matt-auto-ui:";
  function prefs() {
    var out = {};
    try {
      if (window.name.indexOf(PREFIX) === 0) {
        window.name.slice(PREFIX.length).split(";").forEach(function (kv) {
          var i = kv.indexOf("=");
          if (i > 0) out[kv.slice(0, i)] = kv.slice(i + 1);
        });
      }
    } catch (e) {}
    return out;
  }
  function setPref(key, value) {
    var p = prefs();
    p[key] = value;
    try {
      window.name = PREFIX + Object.keys(p).map(function (k) { return k + "=" + p[k]; }).join(";");
    } catch (e) {}
  }
  function currentTheme() {
    if (/theme=light/.test(location.hash)) return "light";
    if (/theme=dark/.test(location.hash)) return "dark";
    return prefs().theme === "light" ? "light" : "dark";
  }
  function rememberTheme(name) {
    setPref("theme", name);
    try { history.replaceState(null, "", "#theme=" + name); } catch (e) {}
  }
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    var btn = document.getElementById("btn-theme");
    btn.textContent = THEMES[name].label;
    btn.setAttribute("aria-label", name === "dark" ? "라이트 테마로 전환" : "다크 테마로 전환");
  }
  applyTheme(currentTheme());
  // A #theme= link opened while the page is already up changes the hash without
  // reloading, so listen for it rather than only reading it at startup.
  window.addEventListener("hashchange", function () { applyTheme(currentTheme()); });
  document.getElementById("btn-theme").addEventListener("click", function () {
    var next = THEMES[currentTheme()].next;
    rememberTheme(next);
    applyTheme(next);
  });

  // ── decision review disclosure ─────────────────────────────
  // At the interview gate the decisions are the report, so it opens; once a run
  // is under way progress is what the reader came for, so it starts collapsed.
  // Either way the reader's own choice wins and survives the live reload.
  var decBtn = document.getElementById("btn-decisions");
  var decBody = document.getElementById("decisions-body");
  function setDecisions(open) {
    decBtn.setAttribute("aria-expanded", open ? "true" : "false");
    decBody.hidden = !open;
  }
  var decPref = prefs().dec;
  setDecisions(decPref ? decPref === "open" : !data.progress);
  decBtn.addEventListener("click", function () {
    var open = decBtn.getAttribute("aria-expanded") !== "true";
    setPref("dec", open ? "open" : "closed");
    setDecisions(open);
  });

  // ── header ─────────────────────────────────────────────────
  document.title = data.title + " — 결정 그래프";
  document.getElementById("r-title").textContent = data.title;
  var total = Object.keys(decisionsById).length;
  document.getElementById("r-meta").textContent =
    "결정 그래프 — " + data.generated + " · 결정 " + total + "개";
  document.getElementById("r-summary").textContent = data.summary;
  document.getElementById("r-edits-name").textContent = data.slug + ".edits.json";
  document.getElementById("r-dcount").textContent = "결정 " + total + "개" +
    (data.progress ? " · 검토하고 수정할 수 있습니다" : "");

  // ── toolbar state (looked up before render; renderNode calls updateToolbar) ──
  var btnExport = document.getElementById("btn-export");
  var btnReset = document.getElementById("btn-reset");
  var countEl = document.getElementById("edit-count");

  function changedIds() { return Object.keys(decisionsById).filter(isChanged); }

  function updateToolbar() {
    var n = changedIds().length;
    countEl.textContent = n ? "노드 " + n + "개 변경됨" : "변경 없음";
    btnExport.disabled = n === 0;
    btnReset.disabled = Object.keys(edits).length === 0;
  }

  // ── render ─────────────────────────────────────────────────
  var STATUS_LABEL = {
    "done": "완료", "in-progress": "진행 중",
    "pending": "대기", "skipped": "건너뜀"
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // ── live progress + ticket tracking (present while a run is under way) ──
  var PROGRESS_STATE_LABEL = { "running": "진행 중", "blocked": "막힘", "done": "완료" };
  var TICKET_STATUS_LABEL = {
    "done": "완료", "in-progress": "진행 중", "blocked": "막힘",
    "pending": "대기", "skipped": "건너뜀"
  };
  var BLOCKER_REASON_LABEL = {
    "gate": "게이트 미충족", "escalation": "사용자 답변 대기", "ci": "CI 실패",
    "conflict": "머지 충돌", "dependency": "선행 티켓 대기", "worker": "워커 이상",
    "review": "리뷰 변경 요청", "other": "막힘"
  };
  var AUTO_REFRESH_MS = 30000;

  function sinceText(iso) {
    var then = Date.parse(iso);
    if (!then) return "";
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return "방금 갱신";
    if (mins < 60) return mins + "분 전 갱신";
    return Math.round(mins / 60) + "시간 전 갱신";
  }

  // Estimates are the run's own guesses, so the page never presents them as
  // measurements: it shows remaining work and a finish time, both labelled 예상.
  function ticketsById() {
    var m = {};
    (data.tickets || []).forEach(function (tk) { m[tk.id] = tk; });
    return m;
  }
  function minutesSince(iso) {
    var then = Date.parse(iso);
    return then ? Math.max(0, (Date.now() - then) / 60000) : 0;
  }
  function remainingOf(tk) {
    var est = tk.estimateMin || 0;
    if (tk.status === "done" || tk.status === "skipped") return 0;
    if (tk.status === "in-progress" && tk.startedAt) return Math.max(est * 0.1, est - minutesSince(tk.startedAt));
    return est;
  }
  // A parallel wave costs its slowest ticket; a sequential one costs their sum.
  function remainingMinutes() {
    var byId = ticketsById();
    var waves = (data.plan && data.plan.waves) || null;
    if (!waves) {
      return (data.tickets || []).reduce(function (a, tk) { return a + remainingOf(tk); }, 0);
    }
    return waves.reduce(function (total, w) {
      var rs = (w.tickets || []).map(function (id) { return byId[id] ? remainingOf(byId[id]) : 0; });
      if (!rs.length) return total;
      return total + (w.mode === "parallel" ? Math.max.apply(null, rs) : rs.reduce(function (a, b) { return a + b; }, 0));
    }, 0);
  }
  function overallPercent() {
    var tks = (data.tickets || []).filter(function (tk) { return tk.status !== "skipped"; });
    if (!tks.length) return null;
    var weighted = tks.some(function (tk) { return tk.estimateMin; });
    var total = 0, done = 0;
    tks.forEach(function (tk) {
      var w = weighted ? (tk.estimateMin || 0) : 1;
      total += w;
      if (tk.status === "done") done += w;
      else if (tk.status === "in-progress") done += w * Math.min(0.9, tk.startedAt && tk.estimateMin ? minutesSince(tk.startedAt) / tk.estimateMin : 0.5);
    });
    return total ? Math.round((done / total) * 100) : 0;
  }
  function fmtMinutes(m) {
    m = Math.round(m);
    if (m < 1) return "1분 미만";
    if (m < 60) return m + "분";
    var h = Math.floor(m / 60);
    return h + "시간" + (m % 60 ? " " + (m % 60) + "분" : "");
  }
  function fmtClock(msFromNow) {
    var d = new Date(Date.now() + msFromNow);
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function bar(pct, cls) {
    var b = el("div", "bar" + (cls ? " " + cls : ""));
    var fill = el("span");
    fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
    b.appendChild(fill);
    return b;
  }

  // A stage's bar: its own `percent` when the run set one, otherwise derived —
  // done is 100, pending is 0, and an implement stage in flight follows its
  // tickets. Skipped stages get no bar at all.
  function stagePercent(s) {
    if (typeof s.percent === "number") return Math.max(0, Math.min(100, Math.round(s.percent)));
    if (s.status === "skipped") return null;
    if (s.status === "done") return 100;
    if (s.status === "pending") return 0;
    if (s.status === "in-progress") {
      var o = overallPercent();
      if (o !== null && (data.tickets || []).length && /implement|구현/i.test(s.id + " " + (s.name || ""))) return o;
      return null;
    }
    return null;
  }

  // The run-wide bar: percent, elapsed, and what is left — the header answers
  // "얼마나 진행됐고 얼마나 남았나" before anything else on the page.
  function renderOverall(host, state) {
    var pct = overallPercent();
    if (pct === null) return;
    var box = el("div", "overall");
    var line = el("div", "line");
    line.appendChild(el("span", "pct", pct + "%"));
    if (data.progress && data.progress.startedAt) {
      line.appendChild(el("span", null, "경과 " + fmtMinutes(minutesSince(data.progress.startedAt))));
    }
    if (state !== "done") {
      var rem = remainingMinutes();
      if (rem > 0) {
        line.appendChild(el("span", "eta",
          "남은 예상 " + fmtMinutes(rem) + " · 완료 예정 " + fmtClock(rem * 60000)));
      }
    }
    box.appendChild(line);
    box.appendChild(bar(pct, state === "done" ? "done" : ""));
    host.appendChild(box);
  }

  // Tickets are nodes, waves are columns, and the run reads left to right —
  // the same shape the coordinator actually executes.
  function waveDuration(w, byId) {
    var rs = (w.tickets || []).map(function (id) { return byId[id] ? (byId[id].estimateMin || 0) : 0; });
    if (!rs.length) return 0;
    return w.mode === "parallel" ? Math.max.apply(null, rs) : rs.reduce(function (a, b) { return a + b; }, 0);
  }

  function agentLabel(tk) {
    // "어떤 sub agent가 어떤 model로" — route first, then the model/effort it maps to.
    var parts = [];
    if (tk.route) parts.push(tk.route);
    var w = tk.worker || {};
    var ml = [w.model, w.effort].filter(Boolean).join("/");
    if (ml) parts.push(ml);
    return parts.join(" · ");
  }

  function renderTicketNode(tk) {
    var node = el("div", "tnode " + (tk.status || "pending"));
    var head = el("div", "nhead");
    head.appendChild(el("span", "ndot"));
    head.appendChild(el("span", "nid", tk.id || ""));
    head.appendChild(el("span", "ntitle", tk.title || ""));
    node.appendChild(head);

    var meta = el("div", "nmeta");
    var st = tk.status || "pending";
    meta.appendChild(el("span", "badge " + (TICKET_STATUS_LABEL[st] ? st : "pending"),
      TICKET_STATUS_LABEL[st] || st));
    if (tk.gates && tk.gates.total) {
      meta.appendChild(el("span", "badge gates", "게이트 " + (tk.gates.met || 0) + "/" + tk.gates.total));
    }
    if (tk.estimateMin) meta.appendChild(el("span", "badge", "~" + fmtMinutes(tk.estimateMin)));
    node.appendChild(meta);

    var agent = agentLabel(tk);
    if (agent) node.appendChild(el("div", "nagent", agent));
    if (tk.worker && tk.worker.dispatchId) {
      node.appendChild(el("div", "nagent", tk.worker.dispatchId));
    }

    if (tk.status === "blocked") {
      var b = tk.blocker || {};
      node.appendChild(el("p", "nwhy",
        (BLOCKER_REASON_LABEL[b.reason] || b.reason || "막힘") + (b.detail ? ": " + b.detail : "")));
    } else if (tk.note) {
      node.appendChild(el("p", "nnote", tk.note));
    }
    node.setAttribute("role", "button");
    node.setAttribute("tabindex", "0");
    node.title = "클릭하면 이 티켓의 상세를 봅니다";
    node.addEventListener("click", function () { openTicket(tk); });
    node.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTicket(tk); }
    });
    return node;
  }

  // Without a plan the tickets still lay out left to right: each blocking level
  // becomes its own column, so the shape survives a run that never planned waves.
  function derivedWaves(tickets) {
    var placed = {}, waves = [], guard = 0;
    var left = tickets.slice();
    while (left.length && guard++ < 50) {
      var ready = left.filter(function (tk) {
        return (tk.blockedBy || []).every(function (id) { return placed[id]; });
      });
      if (!ready.length) ready = left.slice();
      waves.push({ id: "W" + waves.length, mode: ready.length > 1 ? "parallel" : "sequential",
                   tickets: ready.map(function (tk) { return tk.id; }) });
      ready.forEach(function (tk) { placed[tk.id] = true; });
      left = left.filter(function (tk) { return !placed[tk.id]; });
    }
    return waves;
  }

  // ── ticket detail modal ────────────────────────────────────
  // A node is a summary; the modal is what actually happened inside one ticket
  // — who ran it, on what, through which steps, against which gates.
  var GATE_STATUS_LABEL = { "met": "충족", "unmet": "미충족", "manual": "수동 확인", "pending": "대기" };

  function kvRow(dl, key, value, mono) {
    if (!value) return;
    dl.appendChild(el("dt", null, key));
    dl.appendChild(el("dd", mono ? "mono" : null, value));
  }

  function section(title) {
    var s = el("div", "msec");
    s.appendChild(el("h3", null, title));
    return s;
  }

  function openTicket(tk) {
    var back = el("div", "modal-back");
    var box = el("div", "modal");
    box.addEventListener("click", function (e) { e.stopPropagation(); });

    var head = el("div", "mhead");
    head.appendChild(el("span", "mid", tk.id || ""));
    head.appendChild(el("h2", null, tk.title || ""));
    var st = tk.status || "pending";
    head.appendChild(el("span", "badge " + (TICKET_STATUS_LABEL[st] ? st : "pending"),
      TICKET_STATUS_LABEL[st] || st));
    var close = el("button", "mclose", "닫기 (Esc)");
    head.appendChild(close);
    box.appendChild(head);

    if (tk.status === "blocked") {
      var b = tk.blocker || {};
      var blk = el("div", "blocker");
      blk.appendChild(el("div", "why", "막힘 — " + (BLOCKER_REASON_LABEL[b.reason] || b.reason || "이유 미기재")));
      if (b.detail) blk.appendChild(el("p", "detail", b.detail));
      box.appendChild(blk);
    }

    var who = section("워커");
    var dl = el("dl", "kv");
    kvRow(dl, "라우트", tk.route);
    var w = tk.worker || {};
    kvRow(dl, "모델", [w.model, w.effort].filter(Boolean).join(" / "), true);
    kvRow(dl, "디스패치", w.dispatchId, true);
    kvRow(dl, "워크트리", w.worktree, true);
    var timing = [];
    if (tk.estimateMin) timing.push("예상 " + fmtMinutes(tk.estimateMin));
    if (tk.actualMin) timing.push("실제 " + fmtMinutes(tk.actualMin));
    else if (tk.startedAt && tk.status === "in-progress") timing.push("경과 " + fmtMinutes(minutesSince(tk.startedAt)));
    kvRow(dl, "시간", timing.join(" · "));
    if (tk.blockedBy && tk.blockedBy.length) kvRow(dl, "선행", tk.blockedBy.join(", "), true);
    who.appendChild(dl);
    box.appendChild(who);

    if (tk.acceptance && tk.acceptance.length) {
      var acc = section("완료 조건");
      var ul = el("ul");
      ul.style.margin = "0";
      ul.style.paddingLeft = "18px";
      ul.style.fontSize = "13px";
      tk.acceptance.forEach(function (a) { ul.appendChild(el("li", null, a)); });
      acc.appendChild(ul);
      box.appendChild(acc);
    }

    if (tk.steps && tk.steps.length) {
      var stp = section("이 티켓 안에서 일어난 일");
      var list = el("div", "steps");
      tk.steps.forEach(function (s) {
        var row = el("div", "step " + (s.status || "pending"));
        row.appendChild(el("span", "sdot"));
        row.appendChild(el("span", null, s.name));
        if (s.note) row.appendChild(el("span", "snote", s.note));
        list.appendChild(row);
      });
      stp.appendChild(list);
      box.appendChild(stp);
    }

    if (tk.gateList && tk.gateList.length) {
      var g = section("게이트" + (tk.gates && tk.gates.total ? " " + (tk.gates.met || 0) + "/" + tk.gates.total : ""));
      var gl = el("div", "glist");
      tk.gateList.forEach(function (gt) {
        var row = el("div", "gate " + (gt.status || "pending"));
        var line = el("div");
        line.appendChild(el("span", "gid", gt.id || ""));
        line.appendChild(el("span", null, gt.text || ""));
        line.appendChild(el("span", " badge " + (gt.status === "met" ? "done" : gt.status === "unmet" ? "flagged" : "escalated"),
          GATE_STATUS_LABEL[gt.status] || gt.status || ""));
        row.appendChild(line);
        if (gt.check) row.appendChild(el("div", "gcmd", "CHECK: " + gt.check));
        if (gt.expect || gt.actual) {
          row.appendChild(el("div", "gcmp",
            (gt.expect ? "기대 " + gt.expect : "") + (gt.actual ? " · 실제 " + gt.actual : "")));
        }
        gl.appendChild(row);
      });
      g.appendChild(gl);
      box.appendChild(g);
    }

    if (tk.files && tk.files.length) {
      var f = section("건드린 파일");
      var fl = el("div", "mfiles");
      tk.files.forEach(function (fi) {
        var row = el("div");
        row.appendChild(el("span", "p", fi.path));
        row.appendChild(el("span", "add", fi.added ? "+" + fi.added : ""));
        row.appendChild(el("span", "del", fi.removed ? "−" + fi.removed : ""));
        fl.appendChild(row);
      });
      f.appendChild(fl);
      box.appendChild(f);
    }

    if (tk.commits && tk.commits.length) {
      var c = section("커밋");
      var cl = el("div", "mfiles");
      tk.commits.forEach(function (cm) {
        var row = el("div");
        row.appendChild(el("span", "p", cm.sha || ""));
        row.appendChild(el("span", null, cm.subject || ""));
        cl.appendChild(row);
      });
      c.appendChild(cl);
      box.appendChild(c);
    }

    if (tk.note) box.appendChild(el("p", "note", tk.note));

    back.appendChild(box);
    function dismiss() {
      if (back.parentNode) back.parentNode.removeChild(back);
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") dismiss(); }
    back.addEventListener("click", dismiss);
    close.addEventListener("click", dismiss);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(back);
  }

  function laneNode(title, status, rows, extra) {
    var node = el("div", "tnode " + (status || "pending"));
    var head = el("div", "nhead");
    head.appendChild(el("span", "ndot"));
    head.appendChild(el("span", "ntitle", title));
    node.appendChild(head);
    if (extra) node.appendChild(extra);
    (rows || []).forEach(function (r) { node.appendChild(r); });
    return node;
  }

  function checkRow(c) {
    var row = el("div", "checkrow " + (c.status || "pending"));
    row.appendChild(el("span", "cdot"));
    row.appendChild(el("span", null, c.name || ""));
    if (c.detail) row.appendChild(el("span", "cdetail", c.detail));
    return row;
  }

  // The run does not end at the last ticket: review and, in ship mode, the PR
  // are stages of the same left-to-right flow, not an afterthought in prose.
  function renderReviewLane() {
    var r = data.review;
    if (!r) return null;
    var lane = el("div", "wcol lane");
    var lh = el("div", "lhead");
    lh.appendChild(el("span", null, "리뷰"));
    lh.appendChild(el("span", "badge " + (r.status === "done" ? "done" : r.status === "blocked" ? "flagged" : "in-progress"),
      TICKET_STATUS_LABEL[r.status] || r.status || "대기"));
    lane.appendChild(lh);
    (r.passes || []).forEach(function (pass) {
      var rows = [];
      if (typeof pass.findings === "number") {
        rows.push(el("div", "nnote", pass.findings ? "지적 " + pass.findings + "건" : "지적 없음"));
      }
      if (pass.note) rows.push(el("p", "nnote", pass.note));
      lane.appendChild(laneNode(pass.name || pass.id, pass.status, rows));
    });
    if (r.skill) lane.appendChild(el("div", "nagent", r.skill));
    if (r.note) lane.appendChild(el("p", "why", r.note));
    return lane;
  }

  function renderPrLane() {
    var pr = data.pr;
    if (!pr) return null;
    var lane = el("div", "wcol lane");
    var lh = el("div", "lhead");
    lh.appendChild(el("span", null, "PR"));
    lh.appendChild(el("span", "badge " + (pr.status === "done" ? "done" : pr.status === "blocked" ? "flagged" : "in-progress"),
      TICKET_STATUS_LABEL[pr.status] || pr.status || "대기"));
    if (pr.cycles) lh.appendChild(el("span", "wdur", "사이클 " + pr.cycles));
    lane.appendChild(lh);

    var rows = [];
    if (pr.branch && pr.base) rows.push(el("div", "nagent", pr.branch + " → " + pr.base));
    (pr.checks || []).forEach(function (c) { rows.push(checkRow(c)); });
    if (pr.url) rows.push(el("div", "plink", pr.url));
    if (pr.note) rows.push(el("p", "nnote", pr.note));
    lane.appendChild(laneNode(pr.number ? "#" + pr.number : "PR", pr.status, rows));
    return lane;
  }

  function renderFlow(host) {
    var tickets = data.tickets || [];
    var extraLanes = [renderReviewLane(), renderPrLane()].filter(Boolean);
    if (!tickets.length && !extraLanes.length) return;
    var byId = ticketsById();
    var plan = data.plan || {};
    var waves = tickets.length
      ? ((plan.waves && plan.waves.length) ? plan.waves : derivedWaves(tickets))
      : [];

    var head = el("div", "flow-head");
    head.appendChild(el("span", "phead", "실행 계획"));
    if (plan.concurrency) head.appendChild(el("span", "badge", "동시 " + plan.concurrency));
    if (plan.placement) head.appendChild(el("span", "badge", plan.placement));
    var liveIndex = waves.findIndex(function (w) {
      return (w.tickets || []).some(function (id) {
        var tk = byId[id];
        return tk && tk.status !== "done" && tk.status !== "skipped";
      });
    });
    if (waves.length) {
      head.appendChild(el("span", "badge",
        "웨이브 " + (liveIndex < 0 ? waves.length : liveIndex + 1) + "/" + waves.length));
    }
    // A long run is mostly finished waves; they collapse to stubs by default so
    // the live one is what the reader lands on. One button brings them all back.
    var expandAll = false;
    var btnAll = el("button", "wtoggle", "완료 웨이브 펼치기");
    btnAll.classList.add("spacer");
    head.appendChild(btnAll);
    host.appendChild(head);

    var wrap = el("div", "flow-wrap");
    var flow = el("div", "flow");
    wrap.appendChild(flow);

    function draw() {
      flow.textContent = "";
      var liveCol = null;
      waves.forEach(function (w, i) {
        if (i) {
          var conn = el("div", "conn");
          conn.appendChild(el("span", null, "→"));
          flow.appendChild(conn);
        }
        var tks = (w.tickets || []).map(function (id) { return byId[id] || { id: id, title: "" }; });
        var allDone = tks.length && tks.every(function (tk) { return tk.status === "done" || tk.status === "skipped"; });
        var collapsed = allDone && !expandAll && waves.length > 3;
        var col = el("div", "wcol" + (collapsed ? " collapsed" : ""));
        var wh = el("div", "whead");
        wh.appendChild(el("span", null, w.id || ("W" + (i + 1))));
        if (!collapsed) {
          wh.appendChild(el("span", "badge " + (w.mode === "parallel" ? "new" : "keep"),
            w.mode === "parallel" ? "병렬 " + tks.length : "순차"));
          var dur = waveDuration(w, byId);
          if (dur) wh.appendChild(el("span", "wdur", "≈" + fmtMinutes(dur)));
        }
        col.appendChild(wh);
        if (collapsed) {
          var stub = el("button", "wtoggle", "✓ " + tks.length + "개\n펼치기");
          stub.addEventListener("click", function () {
            col.classList.remove("collapsed");
            col.removeChild(stub);
            tks.forEach(function (tk) { col.appendChild(renderTicketNode(tk)); });
          });
          col.appendChild(stub);
        } else {
          tks.forEach(function (tk) { col.appendChild(renderTicketNode(tk)); });
          if (w.why) col.appendChild(el("p", "why", w.why));
        }
        if (i === liveIndex) liveCol = col;
        flow.appendChild(col);
      });
      extraLanes.forEach(function (lane, i) {
        if (waves.length || i) {
          var conn2 = el("div", "conn");
          conn2.appendChild(el("span", null, "→"));
          flow.appendChild(conn2);
        }
        flow.appendChild(lane);
      });
      // Land on the wave that is actually running, not on the finished history.
      if (liveCol) {
        requestAnimationFrame(function () {
          wrap.scrollLeft = Math.max(0, liveCol.offsetLeft - flow.offsetLeft - 12);
        });
      }
    }

    btnAll.addEventListener("click", function () {
      expandAll = !expandAll;
      btnAll.textContent = expandAll ? "완료 웨이브 접기" : "완료 웨이브 펼치기";
      draw();
    });

    draw();
    host.appendChild(wrap);
    if (plan.note) host.appendChild(el("p", "why", plan.note));
  }

  function renderProgress() {
    var pr = data.progress;
    var tickets = data.tickets || [];
    if (!pr && !tickets.length) return;
    var host = document.getElementById("r-progress");
    var state = (pr && pr.state) || "running";
    host.className = "progress state-" + state;

    var top = el("div", "top");
    top.appendChild(el("span", "live-dot"));
    var doneCount = tickets.filter(function (tk) { return tk.status === "done"; }).length;
    top.appendChild(el("h2", null, "진행 상황 — " + (PROGRESS_STATE_LABEL[state] || state) +
      (tickets.length ? " (티켓 " + doneCount + "/" + tickets.length + ")" : "")));
    if (pr && pr.updated) top.appendChild(el("span", "stamp", sinceText(pr.updated)));
    host.appendChild(top);

    renderOverall(host, state);

    if (pr && pr.current) {
      var cur = el("p", "current");
      cur.appendChild(el("span", "lbl", "지금:"));
      cur.appendChild(el("span", null, pr.current));
      host.appendChild(cur);
    }
    if (pr && pr.note) host.appendChild(el("p", "note", pr.note));

    var stuck = tickets.filter(function (tk) { return tk.status === "blocked"; });
    stuck.forEach(function (tk) {
      var box = el("div", "blocker");
      box.appendChild(el("div", "why", "막힘 — " + (tk.id ? tk.id + " " : "") + (tk.title || "")));
      var b = tk.blocker || {};
      box.appendChild(el("p", "detail",
        (BLOCKER_REASON_LABEL[b.reason] || b.reason || "이유 미기재") +
        (b.detail ? ": " + b.detail : "")));
      host.appendChild(box);
    });

    renderFlow(host);

    // The page cannot be pushed to, so it pulls: until the run reports done
    // it reloads itself to pick up the republished version — blocked runs keep
    // polling too, since a retry can clear the blocker. Never while the reader
    // has unsaved edits: the sandboxed frame has no localStorage to save them.
    if (state !== "done") {
      var auto = true;
      var row = el("div", "refresh-row");
      var btn = el("button", "ghost", "자동 새로고침 끄기");
      var label = el("span", null, AUTO_REFRESH_MS / 1000 + "초마다 최신 상태를 다시 불러옵니다");
      btn.addEventListener("click", function () {
        auto = !auto;
        btn.textContent = auto ? "자동 새로고침 끄기" : "자동 새로고침 켜기";
        label.textContent = auto
          ? AUTO_REFRESH_MS / 1000 + "초마다 최신 상태를 다시 불러옵니다"
          : "자동 새로고침이 꺼져 있습니다";
      });
      row.appendChild(btn);
      row.appendChild(label);
      host.appendChild(row);
      setInterval(function () {
        if (auto && changedIds().length === 0) location.reload();
      }, AUTO_REFRESH_MS);
    }

    host.hidden = false;
  }

  // ── outcome panel (final run only; absent on the interview gate) ──
  var CHANGE_LABEL = { "new": "신규", "redirect": "방향 전환", "keep": "유지" };
  var KIND_LABEL = { "code": "코드", "docs": "문서", "other": "기타" };
  var FILE_STATUS_LABEL = {
    "added": "생성", "modified": "수정", "deleted": "삭제", "renamed": "이름 변경"
  };
  var KIND_ORDER = { "code": 0, "docs": 1, "other": 2 };

  function stat(label, value, sub) {
    var box = el("div", "stat");
    box.appendChild(el("span", "k", label));
    box.appendChild(el("span", "v", value));
    if (sub) box.appendChild(el("span", "sub", sub));
    return box;
  }

  function lineCell(row, n, cls) {
    var td = el("td", "num");
    td.appendChild(el("span", cls, n ? (cls === "add" ? "+" : "−") + n : "—"));
    row.appendChild(td);
  }

  function renderOutcome() {
    var o = data.outcome;
    if (!o || !o.files || !o.files.length) return;
    var host = document.getElementById("r-outcome");
    var files = o.files.slice().sort(function (a, b) {
      var ka = KIND_ORDER[a.kind] === undefined ? 3 : KIND_ORDER[a.kind];
      var kb = KIND_ORDER[b.kind] === undefined ? 3 : KIND_ORDER[b.kind];
      if (ka !== kb) return ka - kb;
      return ((b.added || 0) + (b.removed || 0)) - ((a.added || 0) + (a.removed || 0));
    });

    function tally(pred) {
      return files.filter(pred).reduce(function (acc, f) {
        acc.files += 1;
        acc.added += f.added || 0;
        acc.removed += f.removed || 0;
        return acc;
      }, { files: 0, added: 0, removed: 0 });
    }
    function byKind(kind) { return tally(function (f) { return f.kind === kind; }); }
    function byStatus(status) { return files.filter(function (f) { return f.status === status; }).length; }
    function lines(t) { return "+" + t.added + " / −" + t.removed; }

    host.appendChild(el("h2", null, "결과 — 이번 실행이 바꾼 것"));
    var refs = [];
    if (o.branch) refs.push(o.branch);
    if (o.baseRef && o.headRef) refs.push(o.baseRef + " → " + o.headRef);
    if (refs.length) host.appendChild(el("div", "refs", refs.join("  ·  ")));

    var stats = el("div", "stats");
    stats.appendChild(stat("파일",
      byStatus("added") + "개 생성 · " + byStatus("modified") + "개 수정",
      byStatus("deleted") ? byStatus("deleted") + "개 삭제" : ""));
    ["code", "docs"].forEach(function (kind) {
      var t = byKind(kind);
      if (!t.files) return;
      stats.appendChild(stat(KIND_LABEL[kind], lines(t), t.files + "개 파일"));
    });
    var other = byKind("other");
    if (other.files) stats.appendChild(stat(KIND_LABEL.other, lines(other), other.files + "개 파일"));
    host.appendChild(stats);
    if (o.note) host.appendChild(el("p", "note", o.note));

    var table = el("table", "files");
    var headRow = el("tr");
    ["파일", "구분", "상태", "추가", "삭제"].forEach(function (h) {
      headRow.appendChild(el("th", null, h));
    });
    table.appendChild(headRow);
    files.forEach(function (f) {
      var row = el("tr");
      var pathCell = el("td", "path", f.path);
      if (f.note) {
        pathCell.appendChild(document.createElement("br"));
        pathCell.appendChild(el("span", "fnote", f.note));
      }
      row.appendChild(pathCell);
      var kindCell = el("td");
      kindCell.appendChild(el("span", "badge " + (KIND_LABEL[f.kind] ? f.kind : "other"),
        KIND_LABEL[f.kind] || f.kind || "기타"));
      row.appendChild(kindCell);
      var statusCell = el("td");
      statusCell.appendChild(el("span", "badge " + (FILE_STATUS_LABEL[f.status] ? f.status : "renamed"),
        FILE_STATUS_LABEL[f.status] || f.status || "수정"));
      row.appendChild(statusCell);
      lineCell(row, f.added || 0, "add");
      lineCell(row, f.removed || 0, "del");
      table.appendChild(row);
    });
    var wrap = el("div", "files-wrap");
    wrap.appendChild(table);
    host.appendChild(wrap);
    host.hidden = false;
  }

  function renderNode(d) {
    var node = el("div", "node");
    if (d.escalated) node.classList.add("escalated");

    var head = el("div", "node-head");
    head.appendChild(el("span", "caret", "▸"));
    head.appendChild(el("span", "q", d.question));
    var badges = el("span", "badges");
    if (CHANGE_LABEL[d.change]) badges.appendChild(el("span", "badge " + d.change, CHANGE_LABEL[d.change]));
    if (d.escalated) badges.appendChild(el("span", "badge escalated", "직접 답변"));
    var editedBadge = el("span", "badge edited", "수정됨");
    var flaggedBadge = el("span", "badge flagged", "문제");
    badges.appendChild(editedBadge);
    badges.appendChild(flaggedBadge);
    head.appendChild(badges);
    node.appendChild(head);

    var detail = el("div", "node-detail");
    var dLine;
    if (d.change) {
      var ba = el("div", "ba");
      var before = el("div", "cell before" + (d.before ? "" : " none"));
      before.appendChild(el("span", "lbl", "이전"));
      before.appendChild(el("span", "txt", d.before || "없음 — 정해진 바 없었음"));
      ba.appendChild(before);
      ba.appendChild(el("span", "arrow", "→"));
      var after = el("div", "cell after");
      after.appendChild(el("span", "lbl", "이후"));
      dLine = el("span", "txt d", d.decision);
      after.appendChild(dLine);
      ba.appendChild(after);
      detail.appendChild(ba);
    } else {
      dLine = el("p", "d", d.decision);
      detail.appendChild(dLine);
    }
    detail.appendChild(el("p", "r", d.rationale));

    detail.appendChild(el("label", null, "결정 수정 (그대로 두면 유지됩니다)"));
    var ta = document.createElement("textarea");
    ta.value = typeof editOf(d.id).decision === "string" ? editOf(d.id).decision : d.decision;
    detail.appendChild(ta);

    var flagRow = el("div", "flag-row");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "flag-" + d.id;
    cb.checked = isFlagged(d.id);
    var cbLabel = document.createElement("label");
    cbLabel.htmlFor = cb.id;
    cbLabel.textContent = "문제로 표시";
    cbLabel.style.margin = "0";
    flagRow.appendChild(cb);
    flagRow.appendChild(cbLabel);
    detail.appendChild(flagRow);

    detail.appendChild(el("label", null, "코멘트 (무엇이 문제인지 / 대신 원하는 방향)"));
    var comment = document.createElement("input");
    comment.type = "text";
    comment.value = editOf(d.id).comment || "";
    detail.appendChild(comment);

    node.appendChild(detail);

    function refresh() {
      node.classList.toggle("edited", isEdited(d.id));
      node.classList.toggle("flagged", isFlagged(d.id));
      editedBadge.style.display = isEdited(d.id) ? "" : "none";
      flaggedBadge.style.display = isFlagged(d.id) ? "" : "none";
      dLine.classList.toggle("struck", isEdited(d.id));
      updateToolbar();
    }

    head.addEventListener("click", function () { node.classList.toggle("open"); });
    ta.addEventListener("input", function () { setEdit(d.id, { decision: ta.value }); refresh(); });
    cb.addEventListener("change", function () { setEdit(d.id, { flagged: cb.checked }); refresh(); });
    comment.addEventListener("input", function () { setEdit(d.id, { comment: comment.value }); refresh(); });

    refresh();
    return node;
  }

  var graph = document.getElementById("graph");
  data.stages.forEach(function (s) {
    var stage = el("div", "stage " + s.status);
    var rail = el("div", "rail");
    rail.appendChild(el("div", "dot"));
    rail.appendChild(el("div", "line"));
    stage.appendChild(rail);

    var body = el("div", "stage-body");
    var headRow = el("div", "stage-head");
    headRow.appendChild(el("h2", null, s.name));
    if (s.skill) headRow.appendChild(el("span", "skill", s.skill));
    headRow.appendChild(el("span", "badge " + s.status, STATUS_LABEL[s.status] || s.status));
    body.appendChild(headRow);
    var pct = stagePercent(s);
    if (pct !== null) {
      var pbox = el("div", "stage-bar");
      pbox.appendChild(bar(pct, pct >= 100 ? "done" : ""));
      var plabel = el("div", null);
      plabel.appendChild(el("span", "pct", pct + "%"));
      pbox.appendChild(plabel);
      body.appendChild(pbox);
    }
    if (s.note) body.appendChild(el("p", "stage-note", s.note));

    if (s.decisions && s.decisions.length) {
      var list = el("div", "decisions");
      s.decisions.forEach(function (d) { list.appendChild(renderNode(d)); });
      body.appendChild(list);
    }
    stage.appendChild(body);
    graph.appendChild(stage);
  });

  renderProgress();
  renderOutcome();

  // ── toolbar actions ────────────────────────────────────────
  function exportPayload() {
    return {
      slug: data.slug,
      exported: new Date().toISOString(),
      edits: changedIds().map(function (id) {
        var entry = decisionsById[id];
        var e = editOf(id);
        return {
          id: id,
          stage: entry.stage.id,
          question: entry.d.question,
          original: entry.d.decision,
          edited: isEdited(id) ? e.decision.trim() : null,
          flagged: isFlagged(id),
          comment: (e.comment || "").trim()
        };
      })
    };
  }

  btnExport.addEventListener("click", function () {
    var json = JSON.stringify(exportPayload(), null, 2);
    var blob = new Blob([json], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = data.slug + ".edits.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).catch(function () {});
    }
  });

  btnReset.addEventListener("click", function () {
    edits = {};
    try { localStorage.removeItem(storeKey); } catch (e) {}
    location.reload();
  });

  updateToolbar();
})();
</script>
</body>
</html>
