<!--
  Starting point for interview-report's decision graph. Copy this file, then
  replace ONLY:
    1. the <title> tag
    2. the JSON inside <script id="graph-data" type="application/json">
  Keep the CSS and JS as-is — the rendering, editing, flagging, and export
  machinery lives there, and consistent output between runs is the point of
  bundling this template.

  Data contract (see SKILL.md for the full spec):
    { title, slug, generated, summary,
      stages: [ { id, name, skill, status, note,
                  decisions: [ { id, question, before, change, decision,
                                rationale, escalated } ] } ],
      progress?: { state, updated, current, note },
      tickets?: [ { id, title, status, blockedBy, blocker: { reason, detail },
                    gates: { met, total }, route, note } ],
      outcome?: { baseRef, headRef, branch, note,
                  files: [ { path, status, kind, added, removed, note } ] } }
  `outcome` is the final run's shipped-changes panel: omit it entirely on the
  interview-gate generation, fill it on the last regeneration.
  Decision ids must be stable across regenerations — localStorage edits and
  the exported <slug>.edits.json both key on them.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPLACE: idea/feature name — Decision Graph</title>
<style>
  /* Orca's own artifact design language: the share page ships these tokens,
     so the report reads as part of Orca rather than a page pasted into it. */
  :root {
    color-scheme: dark;
    --background: #0a0a0a;
    --foreground: #fafafa;
    --card: #171717;
    --secondary: #262626;
    --muted-foreground: #a1a1a1;
    --accent: #404040;
    --border: rgb(255 255 255 / 0.07);
    --border-strong: rgb(255 255 255 / 0.15);
    --ring: #737373;
    --radius: 0.625rem;
    --radius-sm: calc(var(--radius) * 0.6);
    --radius-md: calc(var(--radius) * 0.8);
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;

    --done: #4ade80;
    --done-bg: rgb(74 222 128 / 0.12);
    --progress: #60a5fa;
    --progress-bg: rgb(96 165 250 / 0.12);
    --escalated: #fbbf24;
    --escalated-bg: rgb(251 191 36 / 0.12);
    --edited: #fb923c;
    --edited-bg: rgb(251 146 60 / 0.14);
    --flagged: #f87171;
    --flagged-bg: rgb(248 113 113 / 0.12);
    --muted-bg: rgb(255 255 255 / 0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px 72px;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.65;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.25; margin: 0 0 6px; }
  code { font-family: var(--font-mono); font-size: 0.92em; }
  :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }

  .meta { color: var(--muted-foreground); font-size: 12px; margin-bottom: 20px; }
  .summary {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .summary .icon { margin-right: 8px; }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 32px; }
  .toolbar button {
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    height: 30px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .toolbar button:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--border-strong);
    color: var(--foreground);
  }
  .toolbar button.primary {
    background: var(--foreground);
    border-color: var(--foreground);
    color: #171717;
  }
  .toolbar button.primary:hover:not(:disabled) { background: #e5e5e5; border-color: #e5e5e5; color: #171717; }
  .toolbar button:disabled { opacity: 0.45; cursor: default; }
  .toolbar .count { color: var(--muted-foreground); font-size: 12px; }
  .toolbar .hint { flex-basis: 100%; color: var(--muted-foreground); font-size: 12px; line-height: 1.6; }

  /* ── pipeline rail ─────────────────────────────────────────── */
  .stage { display: flex; gap: 18px; }
  .rail { display: flex; flex-direction: column; align-items: center; flex: 0 0 24px; }
  .rail .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    background: var(--background);
    flex: 0 0 auto;
    margin-top: 8px;
  }
  .stage.done .dot { border-color: var(--done); background: var(--done); }
  .stage.in-progress .dot { border-color: var(--progress); }
  .stage.skipped .dot { border-color: var(--border-strong); background: var(--secondary); }
  .rail .line { width: 1px; flex: 1 1 auto; background: var(--border-strong); min-height: 24px; }
  .stage:last-child .rail .line { display: none; }
  .stage-body { flex: 1 1 auto; padding-bottom: 26px; min-width: 0; }
  .stage-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .stage-head h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .stage-head .skill { color: var(--muted-foreground); font-size: 12px; font-family: var(--font-mono); }
  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 1px 8px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--muted-bg);
    color: var(--muted-foreground);
  }
  .badge.done { background: var(--done-bg); color: var(--done); }
  .badge.in-progress { background: var(--progress-bg); color: var(--progress); }
  .badge.pending, .badge.skipped { background: var(--muted-bg); color: var(--muted-foreground); }
  .badge.escalated { background: var(--escalated-bg); color: var(--escalated); }
  .badge.edited { background: var(--edited-bg); color: var(--edited); }
  .badge.flagged { background: var(--flagged-bg); color: var(--flagged); }
  .stage-note { color: var(--muted-foreground); font-size: 12px; margin: 2px 0 0; }

  /* ── decision nodes ────────────────────────────────────────── */
  .decisions { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .node {
    border: 1px solid var(--border);
    border-left: 2px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--card);
  }
  .node.escalated { border-left-color: var(--escalated); }
  .node.edited { border-left-color: var(--edited); }
  .node.flagged { border-left-color: var(--flagged); }
  .node-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; cursor: pointer; }
  .node-head .q { font-weight: 500; flex: 1 1 auto; min-width: 0; }
  .node-head .caret { color: var(--muted-foreground); transition: transform 0.15s; }
  .node.open .node-head .caret { transform: rotate(90deg); }
  .node-detail { display: none; padding: 0 14px 12px; }
  .node.open .node-detail { display: block; }
  .node-detail .d { margin: 0 0 4px; }
  .node-detail .d.struck { text-decoration: line-through; color: var(--muted-foreground); }
  .node-detail .r { color: var(--muted-foreground); font-size: 13px; margin: 0 0 10px; }
  .node-detail label { display: block; font-size: 11px; color: var(--muted-foreground); margin: 8px 0 2px; }
  .node-detail textarea, .node-detail input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    background: var(--background);
    color: var(--foreground);
  }
  .node-detail textarea { resize: vertical; min-height: 48px; }
  .ba {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 8px;
    margin: 0 0 10px;
  }
  .ba .cell {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--background);
    padding: 8px 10px;
    min-width: 0;
  }
  .ba .cell .lbl { display: block; font-size: 11px; color: var(--muted-foreground); margin-bottom: 2px; }
  .ba .cell.before .txt { color: var(--muted-foreground); }
  .ba .cell.before.none .txt { font-style: italic; }
  .ba .cell.after { border-color: var(--border-strong); }
  .ba .arrow { align-self: center; color: var(--muted-foreground); font-size: 13px; }
  .badge.new { background: var(--progress-bg); color: var(--progress); }
  .badge.redirect { background: var(--edited-bg); color: var(--edited); }
  .badge.keep { background: var(--muted-bg); color: var(--muted-foreground); }
  @media (max-width: 560px) {
    .ba { grid-template-columns: 1fr; }
    .ba .arrow { transform: rotate(90deg); justify-self: start; }
  }
  .flag-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; }
  .flag-row input { accent-color: var(--flagged); }

  /* ── live progress + tickets ───────────────────────────────── */
  .progress {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 14px 18px;
    margin: 12px 0 4px;
  }
  .progress .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .progress h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .progress .stamp { color: var(--muted-foreground); font-size: 11px; margin-left: auto; }
  .progress .current { margin: 8px 0 0; font-size: 13px; }
  .progress .current .lbl { color: var(--muted-foreground); margin-right: 6px; }
  .progress .note { color: var(--muted-foreground); font-size: 12px; margin: 6px 0 0; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--progress); flex: none;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .progress.state-blocked .live-dot { background: var(--flagged); animation: none; }
  .progress.state-done .live-dot { background: var(--done); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .blocker {
    border: 1px solid color-mix(in srgb, var(--flagged) 40%, var(--border));
    background: var(--flagged-bg);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-top: 12px;
  }
  .blocker .why { font-weight: 600; color: var(--flagged); }
  .blocker .detail { color: var(--foreground); font-size: 13px; margin: 2px 0 0; }

  .tickets { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .ticket {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--background);
    padding: 8px 12px;
  }
  .ticket.in-progress { border-color: color-mix(in srgb, var(--progress) 45%, var(--border)); }
  .ticket.blocked { border-color: color-mix(in srgb, var(--flagged) 45%, var(--border)); }
  .ticket .tid { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); flex: none; }
  .ticket .ttitle { flex: 1 1 220px; min-width: 0; }
  .ticket.done .ttitle { color: var(--muted-foreground); }
  .ticket .tnote { flex-basis: 100%; color: var(--muted-foreground); font-size: 12px; }
  .ticket .blocked-by { color: var(--muted-foreground); font-size: 11px; font-family: var(--font-mono); }
  .badge.blocked { background: var(--flagged-bg); color: var(--flagged); }
  .badge.gates { background: var(--muted-bg); color: var(--muted-foreground); font-family: var(--font-mono); }

  .refresh-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); margin-top: 12px; }
  .refresh-row button.ghost {
    font: inherit;
    font-size: 12px;
    height: 26px;
    padding: 0 10px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    cursor: pointer;
  }
  .refresh-row button.ghost:hover { background: var(--accent); border-color: var(--border-strong); color: var(--foreground); }

  /* ── outcome (final run only) ──────────────────────────────── */
  .outcome {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 16px 18px;
    margin: 12px 0 4px;
  }
  .outcome h2 { font-size: 1rem; font-weight: 600; margin: 0 0 2px; }
  .outcome .refs {
    color: var(--muted-foreground);
    font-size: 11px;
    font-family: var(--font-mono);
    margin-bottom: 14px;
  }
  .outcome .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .outcome .stat {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--background);
    padding: 8px 14px;
    min-width: 130px;
  }
  .outcome .stat .k { color: var(--muted-foreground); font-size: 11px; display: block; }
  .outcome .stat .v { font-size: 1rem; font-weight: 600; }
  .outcome .stat .sub { color: var(--muted-foreground); font-size: 11px; display: block; }
  .outcome .note { color: var(--muted-foreground); font-size: 13px; margin: 12px 0 0; }
  .add { color: var(--done); font-variant-numeric: tabular-nums; }
  .del { color: var(--flagged); font-variant-numeric: tabular-nums; }
  .files-wrap { overflow-x: auto; margin-top: 14px; }
  table.files { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.files th, table.files td {
    text-align: left;
    padding: 7px 10px 7px 0;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    white-space: nowrap;
  }
  table.files tr:last-child td { border-bottom: 0; }
  table.files th { color: var(--muted-foreground); font-size: 11px; font-weight: 500; }
  table.files td.num { text-align: right; padding-right: 14px; }
  table.files .path { font-family: var(--font-mono); font-size: 12px; white-space: normal; word-break: break-all; }
  table.files .fnote { color: var(--muted-foreground); font-size: 12px; font-family: var(--font-sans); white-space: normal; }
  .badge.code { background: var(--progress-bg); color: var(--progress); }
  .badge.docs { background: var(--done-bg); color: var(--done); }
  .badge.other { background: var(--muted-bg); color: var(--muted-foreground); }
  .badge.added { background: var(--done-bg); color: var(--done); }
  .badge.modified { background: var(--edited-bg); color: var(--edited); }
  .badge.deleted { background: var(--flagged-bg); color: var(--flagged); }
  .badge.renamed { background: var(--muted-bg); color: var(--muted-foreground); }

  @media (max-width: 640px) {
    body { padding: 24px 14px 56px; }
    h1 { font-size: 1.35rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1 id="r-title"></h1>
  <div class="meta" id="r-meta"></div>
  <div class="summary"><span class="icon">💡</span><span id="r-summary"></span></div>
  <section class="progress" id="r-progress" hidden></section>
  <section class="outcome" id="r-outcome" hidden></section>
  <div class="toolbar">
    <button class="primary" id="btn-export">수정 내보내기</button>
    <button id="btn-reset">수정 초기화</button>
    <span class="count" id="edit-count"></span>
    <span class="hint">노드를 클릭하면 근거를 보고, 결정을 고치거나 문제로 표시할 수 있습니다.
      내보내기는 <code id="r-edits-name"></code> 파일을 만듭니다 — <code>docs/agents/matt-auto-log/</code>에
      저장해 두면 다음 실행 때 matt-auto가 해당 스테이지부터 다시 작업합니다.</span>
  </div>
  <div id="graph"></div>
</main>

<script id="graph-data" type="application/json">
{
  "title": "REPLACE: idea/feature name, in Korean",
  "slug": "replace-slug",
  "generated": "REPLACE: YYYY-MM-DD",
  "summary": "REPLACE: 2-4 plain-language sentences on what got decided and why, in Korean.",
  "stages": [
    {
      "id": "interview",
      "name": "인터뷰",
      "skill": "grill-with-docs",
      "status": "done",
      "note": "",
      "decisions": [
        {
          "id": "interview-1",
          "question": "REPLACE: question, restated plainly, in Korean",
          "decision": "REPLACE: the decision, in Korean",
          "rationale": "REPLACE: one-line rationale, in Korean",
          "escalated": false
        }
      ]
    },
    {
      "id": "spec",
      "name": "스펙",
      "skill": "to-spec",
      "status": "pending",
      "note": "",
      "decisions": []
    }
  ],
  "outcome": {
    "baseRef": "REPLACE: baseline commit, short sha",
    "headRef": "REPLACE: final commit, short sha",
    "branch": "REPLACE: branch the work landed on",
    "note": "REPLACE: one line on what the diff amounts to, in Korean — or drop this key",
    "files": [
      {
        "path": "REPLACE: path/from/repo/root.ts",
        "status": "added",
        "kind": "code",
        "added": 0,
        "removed": 0,
        "note": "REPLACE: what this file does now, in Korean"
      }
    ]
  }
}
</script>

<script>
(function () {
  "use strict";

  var data = JSON.parse(document.getElementById("graph-data").textContent);
  var storeKey = "matt-auto-edits:" + data.slug;

  function loadEdits() {
    try {
      return JSON.parse(localStorage.getItem(storeKey)) || {};
    } catch (e) { return {}; }
  }
  function saveEdits() {
    try { localStorage.setItem(storeKey, JSON.stringify(edits)); } catch (e) {}
  }
  var edits = loadEdits(); // { [decisionId]: { decision?, flagged?, comment? } }

  var decisionsById = {};
  data.stages.forEach(function (s) {
    (s.decisions || []).forEach(function (d) { decisionsById[d.id] = { d: d, stage: s }; });
  });

  function editOf(id) { return edits[id] || {}; }
  function isEdited(id) {
    var e = editOf(id);
    return typeof e.decision === "string" && e.decision.trim() !== "" &&
           e.decision.trim() !== decisionsById[id].d.decision.trim();
  }
  function isFlagged(id) { return !!editOf(id).flagged; }
  function isChanged(id) { return isEdited(id) || isFlagged(id); }

  function setEdit(id, patch) {
    var e = edits[id] || {};
    Object.keys(patch).forEach(function (k) { e[k] = patch[k]; });
    if ((typeof e.decision !== "string" || e.decision.trim() === "" ||
         e.decision.trim() === decisionsById[id].d.decision.trim()) &&
        !e.flagged && !(e.comment && e.comment.trim())) {
      delete edits[id];
    } else {
      edits[id] = e;
    }
    saveEdits();
  }

  // ── header ─────────────────────────────────────────────────
  document.title = data.title + " — 결정 그래프";
  document.getElementById("r-title").textContent = data.title;
  var total = Object.keys(decisionsById).length;
  document.getElementById("r-meta").textContent =
    "결정 그래프 — " + data.generated + " · 결정 " + total + "개";
  document.getElementById("r-summary").textContent = data.summary;
  document.getElementById("r-edits-name").textContent = data.slug + ".edits.json";

  // ── toolbar state (looked up before render; renderNode calls updateToolbar) ──
  var btnExport = document.getElementById("btn-export");
  var btnReset = document.getElementById("btn-reset");
  var countEl = document.getElementById("edit-count");

  function changedIds() { return Object.keys(decisionsById).filter(isChanged); }

  function updateToolbar() {
    var n = changedIds().length;
    countEl.textContent = n ? "노드 " + n + "개 변경됨" : "변경 없음";
    btnExport.disabled = n === 0;
    btnReset.disabled = Object.keys(edits).length === 0;
  }

  // ── render ─────────────────────────────────────────────────
  var STATUS_LABEL = {
    "done": "완료", "in-progress": "진행 중",
    "pending": "대기", "skipped": "건너뜀"
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // ── live progress + ticket tracking (present while a run is under way) ──
  var PROGRESS_STATE_LABEL = { "running": "진행 중", "blocked": "막힘", "done": "완료" };
  var TICKET_STATUS_LABEL = {
    "done": "완료", "in-progress": "진행 중", "blocked": "막힘",
    "pending": "대기", "skipped": "건너뜀"
  };
  var BLOCKER_REASON_LABEL = {
    "gate": "게이트 미충족", "escalation": "사용자 답변 대기", "ci": "CI 실패",
    "conflict": "머지 충돌", "dependency": "선행 티켓 대기", "worker": "워커 이상",
    "review": "리뷰 변경 요청", "other": "막힘"
  };
  var AUTO_REFRESH_MS = 30000;

  function sinceText(iso) {
    var then = Date.parse(iso);
    if (!then) return "";
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return "방금 갱신";
    if (mins < 60) return mins + "분 전 갱신";
    return Math.round(mins / 60) + "시간 전 갱신";
  }

  function renderTicket(tk) {
    var row = el("div", "ticket " + (tk.status || "pending"));
    if (tk.id) row.appendChild(el("span", "tid", tk.id));
    row.appendChild(el("span", "ttitle", tk.title || ""));
    var st = tk.status || "pending";
    row.appendChild(el("span", "badge " + (TICKET_STATUS_LABEL[st] ? st : "pending"),
      TICKET_STATUS_LABEL[st] || st));
    if (tk.gates && tk.gates.total) {
      row.appendChild(el("span", "badge gates", "게이트 " + (tk.gates.met || 0) + "/" + tk.gates.total));
    }
    if (tk.route) row.appendChild(el("span", "badge", tk.route));
    if (tk.blockedBy && tk.blockedBy.length) {
      row.appendChild(el("span", "blocked-by", "⟵ " + tk.blockedBy.join(", ")));
    }
    var why = tk.blocker && (tk.blocker.detail || tk.blocker.reason);
    if (why) {
      row.appendChild(el("span", "tnote",
        "막힌 이유 — " + (BLOCKER_REASON_LABEL[tk.blocker.reason] || tk.blocker.reason || "") +
        (tk.blocker.detail ? ": " + tk.blocker.detail : "")));
    } else if (tk.note) {
      row.appendChild(el("span", "tnote", tk.note));
    }
    return row;
  }

  function renderProgress() {
    var pr = data.progress;
    var tickets = data.tickets || [];
    if (!pr && !tickets.length) return;
    var host = document.getElementById("r-progress");
    var state = (pr && pr.state) || "running";
    host.className = "progress state-" + state;

    var top = el("div", "top");
    top.appendChild(el("span", "live-dot"));
    var doneCount = tickets.filter(function (tk) { return tk.status === "done"; }).length;
    top.appendChild(el("h2", null, "진행 상황 — " + (PROGRESS_STATE_LABEL[state] || state) +
      (tickets.length ? " (티켓 " + doneCount + "/" + tickets.length + ")" : "")));
    if (pr && pr.updated) top.appendChild(el("span", "stamp", sinceText(pr.updated)));
    host.appendChild(top);

    if (pr && pr.current) {
      var cur = el("p", "current");
      cur.appendChild(el("span", "lbl", "지금:"));
      cur.appendChild(el("span", null, pr.current));
      host.appendChild(cur);
    }
    if (pr && pr.note) host.appendChild(el("p", "note", pr.note));

    var stuck = tickets.filter(function (tk) { return tk.status === "blocked"; });
    stuck.forEach(function (tk) {
      var box = el("div", "blocker");
      box.appendChild(el("div", "why", "막힘 — " + (tk.id ? tk.id + " " : "") + (tk.title || "")));
      var b = tk.blocker || {};
      box.appendChild(el("p", "detail",
        (BLOCKER_REASON_LABEL[b.reason] || b.reason || "이유 미기재") +
        (b.detail ? ": " + b.detail : "")));
      host.appendChild(box);
    });

    if (tickets.length) {
      var list = el("div", "tickets");
      tickets.forEach(function (tk) { list.appendChild(renderTicket(tk)); });
      host.appendChild(list);
    }

    // The page cannot be pushed to, so it pulls: until the run reports done
    // it reloads itself to pick up the republished version — blocked runs keep
    // polling too, since a retry can clear the blocker. Never while the reader
    // has unsaved edits: the sandboxed frame has no localStorage to save them.
    if (state !== "done") {
      var auto = true;
      var row = el("div", "refresh-row");
      var btn = el("button", "ghost", "자동 새로고침 끄기");
      var label = el("span", null, AUTO_REFRESH_MS / 1000 + "초마다 최신 상태를 다시 불러옵니다");
      btn.addEventListener("click", function () {
        auto = !auto;
        btn.textContent = auto ? "자동 새로고침 끄기" : "자동 새로고침 켜기";
        label.textContent = auto
          ? AUTO_REFRESH_MS / 1000 + "초마다 최신 상태를 다시 불러옵니다"
          : "자동 새로고침이 꺼져 있습니다";
      });
      row.appendChild(btn);
      row.appendChild(label);
      host.appendChild(row);
      setInterval(function () {
        if (auto && changedIds().length === 0) location.reload();
      }, AUTO_REFRESH_MS);
    }

    host.hidden = false;
  }

  // ── outcome panel (final run only; absent on the interview gate) ──
  var CHANGE_LABEL = { "new": "신규", "redirect": "방향 전환", "keep": "유지" };
  var KIND_LABEL = { "code": "코드", "docs": "문서", "other": "기타" };
  var FILE_STATUS_LABEL = {
    "added": "생성", "modified": "수정", "deleted": "삭제", "renamed": "이름 변경"
  };
  var KIND_ORDER = { "code": 0, "docs": 1, "other": 2 };

  function stat(label, value, sub) {
    var box = el("div", "stat");
    box.appendChild(el("span", "k", label));
    box.appendChild(el("span", "v", value));
    if (sub) box.appendChild(el("span", "sub", sub));
    return box;
  }

  function lineCell(row, n, cls) {
    var td = el("td", "num");
    td.appendChild(el("span", cls, n ? (cls === "add" ? "+" : "−") + n : "—"));
    row.appendChild(td);
  }

  function renderOutcome() {
    var o = data.outcome;
    if (!o || !o.files || !o.files.length) return;
    var host = document.getElementById("r-outcome");
    var files = o.files.slice().sort(function (a, b) {
      var ka = KIND_ORDER[a.kind] === undefined ? 3 : KIND_ORDER[a.kind];
      var kb = KIND_ORDER[b.kind] === undefined ? 3 : KIND_ORDER[b.kind];
      if (ka !== kb) return ka - kb;
      return ((b.added || 0) + (b.removed || 0)) - ((a.added || 0) + (a.removed || 0));
    });

    function tally(pred) {
      return files.filter(pred).reduce(function (acc, f) {
        acc.files += 1;
        acc.added += f.added || 0;
        acc.removed += f.removed || 0;
        return acc;
      }, { files: 0, added: 0, removed: 0 });
    }
    function byKind(kind) { return tally(function (f) { return f.kind === kind; }); }
    function byStatus(status) { return files.filter(function (f) { return f.status === status; }).length; }
    function lines(t) { return "+" + t.added + " / −" + t.removed; }

    host.appendChild(el("h2", null, "결과 — 이번 실행이 바꾼 것"));
    var refs = [];
    if (o.branch) refs.push(o.branch);
    if (o.baseRef && o.headRef) refs.push(o.baseRef + " → " + o.headRef);
    if (refs.length) host.appendChild(el("div", "refs", refs.join("  ·  ")));

    var stats = el("div", "stats");
    stats.appendChild(stat("파일",
      byStatus("added") + "개 생성 · " + byStatus("modified") + "개 수정",
      byStatus("deleted") ? byStatus("deleted") + "개 삭제" : ""));
    ["code", "docs"].forEach(function (kind) {
      var t = byKind(kind);
      if (!t.files) return;
      stats.appendChild(stat(KIND_LABEL[kind], lines(t), t.files + "개 파일"));
    });
    var other = byKind("other");
    if (other.files) stats.appendChild(stat(KIND_LABEL.other, lines(other), other.files + "개 파일"));
    host.appendChild(stats);
    if (o.note) host.appendChild(el("p", "note", o.note));

    var table = el("table", "files");
    var headRow = el("tr");
    ["파일", "구분", "상태", "추가", "삭제"].forEach(function (h) {
      headRow.appendChild(el("th", null, h));
    });
    table.appendChild(headRow);
    files.forEach(function (f) {
      var row = el("tr");
      var pathCell = el("td", "path", f.path);
      if (f.note) {
        pathCell.appendChild(document.createElement("br"));
        pathCell.appendChild(el("span", "fnote", f.note));
      }
      row.appendChild(pathCell);
      var kindCell = el("td");
      kindCell.appendChild(el("span", "badge " + (KIND_LABEL[f.kind] ? f.kind : "other"),
        KIND_LABEL[f.kind] || f.kind || "기타"));
      row.appendChild(kindCell);
      var statusCell = el("td");
      statusCell.appendChild(el("span", "badge " + (FILE_STATUS_LABEL[f.status] ? f.status : "renamed"),
        FILE_STATUS_LABEL[f.status] || f.status || "수정"));
      row.appendChild(statusCell);
      lineCell(row, f.added || 0, "add");
      lineCell(row, f.removed || 0, "del");
      table.appendChild(row);
    });
    var wrap = el("div", "files-wrap");
    wrap.appendChild(table);
    host.appendChild(wrap);
    host.hidden = false;
  }

  function renderNode(d) {
    var node = el("div", "node");
    if (d.escalated) node.classList.add("escalated");

    var head = el("div", "node-head");
    head.appendChild(el("span", "caret", "▸"));
    head.appendChild(el("span", "q", d.question));
    var badges = el("span", "badges");
    if (CHANGE_LABEL[d.change]) badges.appendChild(el("span", "badge " + d.change, CHANGE_LABEL[d.change]));
    if (d.escalated) badges.appendChild(el("span", "badge escalated", "직접 답변"));
    var editedBadge = el("span", "badge edited", "수정됨");
    var flaggedBadge = el("span", "badge flagged", "문제");
    badges.appendChild(editedBadge);
    badges.appendChild(flaggedBadge);
    head.appendChild(badges);
    node.appendChild(head);

    var detail = el("div", "node-detail");
    var dLine;
    if (d.change) {
      var ba = el("div", "ba");
      var before = el("div", "cell before" + (d.before ? "" : " none"));
      before.appendChild(el("span", "lbl", "이전"));
      before.appendChild(el("span", "txt", d.before || "없음 — 정해진 바 없었음"));
      ba.appendChild(before);
      ba.appendChild(el("span", "arrow", "→"));
      var after = el("div", "cell after");
      after.appendChild(el("span", "lbl", "이후"));
      dLine = el("span", "txt d", d.decision);
      after.appendChild(dLine);
      ba.appendChild(after);
      detail.appendChild(ba);
    } else {
      dLine = el("p", "d", d.decision);
      detail.appendChild(dLine);
    }
    detail.appendChild(el("p", "r", d.rationale));

    detail.appendChild(el("label", null, "결정 수정 (그대로 두면 유지됩니다)"));
    var ta = document.createElement("textarea");
    ta.value = typeof editOf(d.id).decision === "string" ? editOf(d.id).decision : d.decision;
    detail.appendChild(ta);

    var flagRow = el("div", "flag-row");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "flag-" + d.id;
    cb.checked = isFlagged(d.id);
    var cbLabel = document.createElement("label");
    cbLabel.htmlFor = cb.id;
    cbLabel.textContent = "문제로 표시";
    cbLabel.style.margin = "0";
    flagRow.appendChild(cb);
    flagRow.appendChild(cbLabel);
    detail.appendChild(flagRow);

    detail.appendChild(el("label", null, "코멘트 (무엇이 문제인지 / 대신 원하는 방향)"));
    var comment = document.createElement("input");
    comment.type = "text";
    comment.value = editOf(d.id).comment || "";
    detail.appendChild(comment);

    node.appendChild(detail);

    function refresh() {
      node.classList.toggle("edited", isEdited(d.id));
      node.classList.toggle("flagged", isFlagged(d.id));
      editedBadge.style.display = isEdited(d.id) ? "" : "none";
      flaggedBadge.style.display = isFlagged(d.id) ? "" : "none";
      dLine.classList.toggle("struck", isEdited(d.id));
      updateToolbar();
    }

    head.addEventListener("click", function () { node.classList.toggle("open"); });
    ta.addEventListener("input", function () { setEdit(d.id, { decision: ta.value }); refresh(); });
    cb.addEventListener("change", function () { setEdit(d.id, { flagged: cb.checked }); refresh(); });
    comment.addEventListener("input", function () { setEdit(d.id, { comment: comment.value }); refresh(); });

    refresh();
    return node;
  }

  var graph = document.getElementById("graph");
  data.stages.forEach(function (s) {
    var stage = el("div", "stage " + s.status);
    var rail = el("div", "rail");
    rail.appendChild(el("div", "dot"));
    rail.appendChild(el("div", "line"));
    stage.appendChild(rail);

    var body = el("div", "stage-body");
    var headRow = el("div", "stage-head");
    headRow.appendChild(el("h2", null, s.name));
    if (s.skill) headRow.appendChild(el("span", "skill", s.skill));
    headRow.appendChild(el("span", "badge " + s.status, STATUS_LABEL[s.status] || s.status));
    body.appendChild(headRow);
    if (s.note) body.appendChild(el("p", "stage-note", s.note));

    if (s.decisions && s.decisions.length) {
      var list = el("div", "decisions");
      s.decisions.forEach(function (d) { list.appendChild(renderNode(d)); });
      body.appendChild(list);
    }
    stage.appendChild(body);
    graph.appendChild(stage);
  });

  renderProgress();
  renderOutcome();

  // ── toolbar actions ────────────────────────────────────────
  function exportPayload() {
    return {
      slug: data.slug,
      exported: new Date().toISOString(),
      edits: changedIds().map(function (id) {
        var entry = decisionsById[id];
        var e = editOf(id);
        return {
          id: id,
          stage: entry.stage.id,
          question: entry.d.question,
          original: entry.d.decision,
          edited: isEdited(id) ? e.decision.trim() : null,
          flagged: isFlagged(id),
          comment: (e.comment || "").trim()
        };
      })
    };
  }

  btnExport.addEventListener("click", function () {
    var json = JSON.stringify(exportPayload(), null, 2);
    var blob = new Blob([json], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = data.slug + ".edits.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).catch(function () {});
    }
  });

  btnReset.addEventListener("click", function () {
    edits = {};
    try { localStorage.removeItem(storeKey); } catch (e) {}
    location.reload();
  });

  updateToolbar();
})();
</script>
</body>
</html>
