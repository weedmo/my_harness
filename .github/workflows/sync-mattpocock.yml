name: Sync mattpocock skills
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync vendored skills from mattpocock/skills
        id: sync
        run: |
          bash plugins/matt-loop-codex/scripts/sync-upstream.sh
          if git status --porcelain plugins/matt-loop-codex/skills plugins/matt-loop-claude/skills | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -- plugins/matt-loop-codex/mattpocock.lock.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No skill changes upstream"
          fi
      - name: Bump matt-loop patch version
        if: steps.sync.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import json

          plugin_paths = [
              "plugins/matt-loop-claude/.claude-plugin/plugin.json",
              "plugins/matt-loop-codex/.codex-plugin/plugin.json",
          ]
          d = json.load(open(plugin_paths[0]))
          major, minor, patch = d["version"].split(".")
          new = f"{major}.{minor}.{int(patch) + 1}"
          for p in plugin_paths:
              d = json.load(open(p))
              d["version"] = new
              with open(p, "w") as f:
                  json.dump(d, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          mkt_path = ".claude-plugin/marketplace.json"
          m = json.load(open(mkt_path))
          for pl in m["plugins"]:
              if pl["name"] == "matt-loop":
                  pl["version"] = new
          with open(mkt_path, "w") as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"matt-loop -> {new}")
          PY
      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          SHA=$(python3 -c "import json; print(json.load(open('plugins/matt-loop-codex/mattpocock.lock.json'))['commit'][:12])")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/matt-loop-codex plugins/matt-loop-claude .claude-plugin/marketplace.json
          git commit -m "chore(matt-loop): sync mattpocock skills to ${SHA}"
          git push origin main
